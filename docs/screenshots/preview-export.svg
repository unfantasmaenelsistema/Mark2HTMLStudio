<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="expBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="expShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="32" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#expBg)" />

  <!-- Export Modal Mockup -->
  <g transform="translate(250, 45)" filter="url(#expShadow)">
    <rect width="700" height="585" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />

    <!-- Modal Header -->
    <g transform="translate(28, 28)">
      <rect width="40" height="40" rx="10" fill="#e0e7ff" />
      <text x="20" y="26" text-anchor="middle" font-family="sans-serif" font-size="18">📦</text>
      <text x="56" y="22" font-family="sans-serif" font-size="17" font-weight="800" fill="#0f172a">
        Exportar Documento Profesional
      </text>
      <text x="56" y="38" font-family="sans-serif" font-size="12" fill="#64748b">
        Elige el formato de entrega: HTML autónomo, Paquete ZIP con imágenes o PDF
      </text>
      <text x="615" y="24" font-family="sans-serif" font-size="18" fill="#94a3b8">✕</text>
    </g>

    <line x1="0" y1="84" x2="700" y2="84" stroke="#f1f5f9" stroke-width="1" />

    <!-- Cards Grid -->
    <g transform="translate(28, 102)">
      <!-- Card 1: HTML Autónomo -->
      <g transform="translate(0, 0)">
        <rect width="310" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
        <rect x="16" y="16" width="32" height="32" rx="8" fill="#e0e7ff" />
        <text x="32" y="38" text-anchor="middle" font-family="sans-serif" font-size="15">🌐</text>
        <text x="58" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a">HTML Autónomo</text>
        <text x="58" y="48" font-family="sans-serif" font-size="10" font-weight="600" fill="#4f46e5">1 archivo sin dependencias</text>
        <text x="16" y="78" font-family="sans-serif" font-size="11" fill="#64748b">
          Incluye todo el CSS, scripts Prism y estilos incrustados. Ideal para compartir por email o Teams.
        </text>
        <rect x="16" y="96" width="278" height="26" rx="6" fill="#4f46e5" />
        <text x="155" y="113" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Descargar .html</text>
      </g>

      <!-- Card 2: Paquete ZIP con Imágenes (HIGHLIGHTED) -->
      <g transform="translate(334, 0)">
        <rect width="310" height="135" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" />
        <rect x="16" y="16" width="32" height="32" rx="8" fill="#ede9fe" />
        <text x="32" y="38" text-anchor="middle" font-family="sans-serif" font-size="15">🗂️</text>
        <text x="58" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#5b21b6">Paquete ZIP (.zip)</text>
        <rect x="235" y="14" width="60" height="18" rx="4" fill="#8b5cf6" />
        <text x="265" y="27" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#ffffff">RECOMENDADO</text>
        <text x="58" y="48" font-family="sans-serif" font-size="10" font-weight="600" fill="#7c3aed">HTML + Carpeta ./images/</text>
        <text x="16" y="78" font-family="sans-serif" font-size="11" fill="#4c1d95">
          Guarda las imágenes en la carpeta local <tspan font-family="monospace">./images/</tspan> con rutas relativas limpias.
        </text>
        <rect x="16" y="96" width="278" height="26" rx="6" fill="#7c3aed" />
        <text x="155" y="113" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Descargar Paquete ZIP</text>
      </g>

      <!-- Card 3: PDF Vectorial -->
      <g transform="translate(0, 150)">
        <rect width="310" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
        <rect x="16" y="16" width="32" height="32" rx="8" fill="#fee2e2" />
        <text x="32" y="38" text-anchor="middle" font-family="sans-serif" font-size="15">📄</text>
        <text x="58" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a">Documento PDF</text>
        <text x="58" y="48" font-family="sans-serif" font-size="10" font-weight="600" fill="#e11d48">Vectorial &amp; Listo para imprimir</text>
        <text x="16" y="78" font-family="sans-serif" font-size="11" fill="#64748b">
          Exportación de fidelidad tipográfica con saltos de página limpios y preservación de colores.
        </text>
        <rect x="16" y="96" width="278" height="26" rx="6" fill="#0f172a" />
        <text x="155" y="113" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Generar PDF</text>
      </g>

      <!-- Card 4: Markdown Puro & Copia rápida -->
      <g transform="translate(334, 150)">
        <rect width="310" height="135" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
        <rect x="16" y="16" width="32" height="32" rx="8" fill="#dcfce7" />
        <text x="32" y="38" text-anchor="middle" font-family="sans-serif" font-size="15">📋</text>
        <text x="58" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a">Copiar Código</text>
        <text x="58" y="48" font-family="sans-serif" font-size="10" font-weight="600" fill="#059669">HTML al Portapapeles</text>
        <text x="16" y="78" font-family="sans-serif" font-size="11" fill="#64748b">
          Copia al portapapeles el código HTML final optimizado para insertar en WordPress, Ghost o wikis.
        </text>
        <rect x="16" y="96" width="278" height="26" rx="6" fill="#059669" />
        <text x="155" y="113" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Copiar HTML</text>
      </g>
    </g>

    <!-- Bottom Privacy Assurance -->
    <g transform="translate(28, 420)">
      <rect width="644" height="40" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
      <text x="18" y="24" font-family="sans-serif" font-size="11" font-weight="600" fill="#065f46">
        🔒 Privacidad garantizada: Todas las exportaciones se generan al 100% en tu navegador.
      </text>
    </g>
  </g>
</svg>
